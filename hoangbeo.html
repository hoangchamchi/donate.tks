<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuôi Tôi </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #08101b;
            --bg-layer: rgba(255, 255, 255, 0.08);
            --bg-panel: rgba(255, 255, 255, 0.12);
            --text-primary: #eef2f7;
            --text-secondary: #b8c4d2;
            --text-strong: #142329;
            --accent: #e9b35d;
            --accent-soft: rgba(233, 179, 93, 0.16);
            --border: rgba(255, 255, 255, 0.14);
            --shadow: 0 32px 90px rgba(0, 0, 0, 0.26);
            --radius: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at top left, rgba(233, 179, 93, 0.14), transparent 18%),
                        radial-gradient(circle at bottom right, rgba(160, 200, 255, 0.09), transparent 18%),
                        linear-gradient(180deg, #0a131c 0%, #101b28 55%, #141d28 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 75% 10%, rgba(255,255,255,0.08), transparent 20%),
                              radial-gradient(circle at 15% 80%, rgba(233,179,93,0.08), transparent 16%);
            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 32px 24px 64px;
            position: relative;
            z-index: 1;
        }

        .marquee-container {
            overflow: hidden;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.06);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
            padding: 12px 0;
            margin-bottom: 28px;
            backdrop-filter: blur(16px);
        }

        .marquee {
            display: flex;
            animation: marquee 28s linear infinite;
        }

        .marquee-item {
            white-space: nowrap;
            padding: 0 42px;
            color: rgba(239,242,247,0.86);
            font-size: 0.98rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .profile-card,
        .story-section,
        .donation-section,
        .recent-donations {
            background: rgba(255,255,255,0.12);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
        }

        .profile-card {
            padding: 42px 36px 32px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 85% 15%, rgba(233,179,93,0.14), transparent 18%),
                        radial-gradient(circle at 15% 85%, rgba(118, 175, 255, 0.08), transparent 18%);
            pointer-events: none;
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 22px;
            z-index: 1;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.9);
            display: grid;
            place-items: center;
            font-size: 4rem;
            background: linear-gradient(180deg, rgba(255,244,227,0.96), rgba(255,221,162,0.95));
            box-shadow: 0 24px 50px rgba(0,0,0,0.18);
        }

        .status-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            transform: translate(10%, 10%);
            background: #142738;
            color: #f9fafb;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.14);
        }

        .story-section {
            padding: 30px 32px 28px;
            margin-top: 16px;
        }

        .story-title {
            color: #f6f7fa;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 0.02em;
            position: relative;
        }

        .story-title::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 48px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(233,179,93,1), rgba(255,143,112,0.9));
        }

        .story-content {
            color: var(--text-secondary);
            line-height: 1.85;
            font-size: 1rem;
            letter-spacing: 0.01em;
        }

        .story-content p {
            margin-bottom: 16px;
        }

        .highlight {
            background: rgba(233,179,93,0.18);
            padding: 0 5px;
            border-radius: 6px;
            font-weight: 700;
            color: #f8f2de;
        }

        .donation-section {
            padding: 38px 32px 32px;
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            color: #f6f7fa;
            font-size: clamp(1.8rem, 2vw, 2.1rem);
            text-align: center;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }

        .donation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .donation-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .donation-card:hover,
        .donation-card.selected {
            transform: translateY(-8px);
            border-color: rgba(233,179,93,0.95);
            background: rgba(255,255,255,0.14);
            box-shadow: 0 24px 60px rgba(0,0,0,0.18);
        }

        .donation-emoji {
            font-size: 2.8rem;
            margin-bottom: 18px;
        }

        .donation-amount {
            font-size: 1.55rem;
            font-weight: 700;
            color: #f8f3e8;
            margin-bottom: 10px;
        }

        .donation-desc {
            color: var(--text-secondary);
            font-size: 0.96rem;
            line-height: 1.7;
        }

        .donate-btn {
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, #eab660 0%, #ff9079 100%);
            border: none;
            border-radius: 18px;
            color: #09141c;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
            box-shadow: 0 18px 42px rgba(255, 144, 121, 0.32);
            position: relative;
            overflow: hidden;
        }

        .donate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 50px rgba(255, 144, 121, 0.42);
        }

        .donate-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.24) 0%, transparent 50%);
            opacity: 0.7;
            pointer-events: none;
        }

        .recent-donations {
            padding: 36px 32px 32px;
        }

        .donation-list {
            max-height: 420px;
            overflow-y: auto;
        }

        .donation-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            transition: background 0.3s ease;
        }

        .donation-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .donation-item:last-child {
            border-bottom: none;
        }

        .donor-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f3d28d 0%, #ffbba3 100%);
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            color: #09141c;
            box-shadow: 0 14px 34px rgba(0,0,0,0.14);
        }

        .donor-info {
            flex: 1;
            min-width: 0;
        }

        .donor-name {
            font-weight: 700;
            color: #eef2f7;
            margin-bottom: 4px;
        }

        .donor-message {
            font-size: 0.94rem;
            color: #b8c4d2;
            line-height: 1.6;
            word-break: break-word;
        }

        .donor-amount {
            font-weight: 700;
            color: #f7c16e;
            font-size: 1.05rem;
            text-align: right;
        }

        .donor-time {
            font-size: 0.82rem;
            color: #8ba2bb;
            text-align: right;
            margin-top: 4px;
        }

        .footer {
            text-align: center;
            padding: 36px 20px 24px;
            color: rgba(239,242,247,0.78);
        }

        .footer a {
            color: #f4d88f;
            text-decoration: none;
            font-weight: 700;
        }

        .disclaimer {
            margin-top: 16px;
            font-size: 0.9rem;
            opacity: 0.78;
            line-height: 1.8;
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
        }

        .toast {
            position: fixed;
            bottom: 26px;
            right: 26px;
            background: rgba(255,255,255,0.96);
            padding: 18px 24px;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(1100px);
            transition: transform 0.45s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            font-size: 1.95rem;
        }

        .toast-message {
            color: #142329;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .troll-badge {
            position: fixed;
            top: 22px;
            right: 22px;
            background: rgba(233,179,93,0.95);
            color: #08101b;
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.01em;
            z-index: 100;
            animation: pulse 2.2s infinite ease-in-out;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        }

        .floating-emoji {
            position: fixed;
            font-size: 1.9rem;
            animation: float 16s infinite linear;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0% { opacity: 0; transform: translateY(110vh) rotate(0deg); }
            3% { opacity: 0.7; }
            100% { opacity: 0.7; transform: translateY(-110vh) rotate(360deg); }
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 760px) {
            .container {
                padding: 20px 16px 46px;
            }

            .marquee-item {
                padding: 0 24px;
                font-size: 0.92rem;
            }

            .profile-card,
            .story-section,
            .donation-section,
            .recent-donations {
                padding: 24px;
                border-radius: 24px;
            }

            .donation-grid {
                grid-template-columns: 1fr;
            }

            .donation-card {
                min-height: unset;
                padding: 20px;
            }

            .donate-btn {
                font-size: 1.12rem;
                padding: 16px 20px;
            }

            .toast {
                right: 16px;
                bottom: 16px;
            }
        }

        ::selection {
            background: rgba(233,179,93,0.24);
            color: #08101b;
        }
    </style>
</head>
<body>
    <div id="floatingEmojisContainer"></div>

    <!-- Marquee -->
    <div class="marquee-container">
        <div class="marquee" id="marqueeContent"></div>
    </div>

    <div class="container">
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar" id="avatarContent"></div>
                <span class="status-badge" id="statusBadge"></span>
            </div>

            <!-- Story -->
            <div class="story-section">
                <h3 class="story-title" id="storyTitle"></h3>
                <div class="story-content" id="storyContent"></div>
            </div>
        </div>

        <!-- Donation Section -->
        <div class="donation-section">
            <h2 class="section-title" id="donateSectionTitle"></h2>
            <div class="donation-grid" id="donationGrid"></div>
            <button class="donate-btn" id="donateBtn"></button>
        </div>

        <!-- Recent Donations -->
        <div class="recent-donations">
            <h2 class="section-title" id="donorsSectionTitle"></h2>
            <div class="donation-list" id="donationList"></div>
        </div>
    </div>



    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-icon">🎉</span>
        <span class="toast-message" id="toastMessage">Cảm ơn bạn đã nuôi tôi!</span>
    </div>

    <script>
        const CONFIG = {
            pageTitle: "Nuôi Tôi 🍜",
            avatar: "https://sf-static.upanhlaylink.com/img/image_20260427ff8f1dcd02c68e6b695e14aef6e0c06a.jpg",
            statusBadge: "😢",
            authorName: "HOANG JR",
            authorLink: "https://www.facebook.com/jurolazy",
            storyTitle: "Câu chuyện của tôi",
            storyContent: `
                <p>xin chào, tôi là một <span class="highlight">cậu bé chăm chỉ</span> ban ngày giả vờ ổn, ban đêm ngồi mò tut tới 3h sáng như một <span class="highlight">con cú bị deadline dí</span>, mải làm nên tóc <span class="highlight">rụng như lá mùa thu</span>... mắt thì <span class="highlight">mờ dần như tương lai</span> nhưng trái tim vẫn cần được yêu thương (và ví tiền thì cần được cứu trợ gấp). 💔</p>
                <p>cuộc sống hiện tại có thể tóm gọn trong 3 chữ: nghèo nhưng cố.
                <p>mỗi đồng bạn donate không chỉ là tiền… mà là ánh sáng cuối đường hầm của tôi.:</p>
                <ul style="margin-top: 10px; margin-left: 20px;">
                    <li>🍜 Được ăn phở có thịt thay vì mì gói</li>
                    <li>☕ Có cà phê để thức, chứ không phải thức vì đói</li>
                    <li>💊 Mua thuốc nhỏ mắt (quan trọng!)</li>
                    <li>🎮 Thỉnh thoảng được chơi game để nhớ mình vẫn là con người</li>
                </ul>
            `,
            marqueeItems: [
                "🔥 BREAKING: RAM não hiện tại: 2%, 98% còn lại quá đói không thể nghĩ ",
                "🎮 Fun fact: Donate đi, tôi hứa sẽ cho bạn tut… (tut không ăn vẫn no)",
                "📊 Thống kê: 90% thời gian mò tut , 10% còn lại… suy nghĩ nên bỏ nghề hay không",
                "☕ Cảnh báo: Thiếu cà phê có thể dẫn đến ngủ sớm",
                "🏆 TOP DONOR: Mẹ tôi - 20k| Lời nhắn: \"Đừng thức khuya nữa con\"",
            ],
            floatingEmojis: ["🍜", "💰", "🎮", "☕", "🍕", "💻", "🎵", "🌙", "⭐"],
            donationOptions: [
                {
                    amount: 10000,
                    emoji: "🥤",
                    description: "1 ly trà đá",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ"
                },
                {
                    amount: 35000,
                    emoji: "🍜",
                    description: "1 tô phở",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ"
                },
                {
                    amount: 100000,
                    emoji: "☕",
                    description: "Cà phê 1 tuần",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ",
                    isDefault: true  // Mức mặc định được chọn sẵn
                },
                {
                    amount: 100000,
                    emoji: "🍕",
                    description: "ăn vặt",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ"
                },
                {
                    amount: 300000,
                    emoji: "🎮",
                    description: "1 skin valorant mới",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ"
                },
                {
                    amount: 500000,
                    emoji: "🤲",
                    description: "cứu đói cả tháng",
                    momoLink: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ"
                }
            ],
            momoFallback: "https://me.momo.vn/4GIEuasOUEiKsvflulfQ",
            recentDonations: [
            ],
            footerText: "Nếu bạn thấy vui, hãy share cho bạn bè cùng cười! 😂",
            disclaimer: `
                ⚠️ Đây là trang web parody/troll.<br>
                Mọi donate đều được sử dụng để mua phở và cà phê (thật sự) 🍜 ☕
            `,
            sectionTitleDonate: "💝 Nuôi Tôi Ngay",
            sectionTitleDonors: " Những người tốt bụng",
            donateButtonText: "Nuôi Tôi",          
            emptyDonationTitle: "tôi đói lắm rồi ",
            emptyDonationQuote: '"💔 Một đồng là động lực, hai đồng là hy vọng, ba đồng là tôi sống lại liền. Ít cũng quý, nhiều càng thương, miễn là ví tôi đỡ đau" 💝',
        };
        
        document.title = CONFIG.pageTitle;

        // State
        let selectedAmount = CONFIG.donationOptions.find(opt => opt.isDefault)?.amount || CONFIG.donationOptions[0].amount;

        // Get MoMo link by amount
        function getMoMoLink(amount) {
            const option = CONFIG.donationOptions.find(opt => opt.amount === amount);
            return option?.momoLink || CONFIG.momoFallback;
        }

        // Render floating emojis
        function renderFloatingEmojis() {
            const container = document.getElementById('floatingEmojisContainer');
            container.innerHTML = CONFIG.floatingEmojis.map((emoji, index) => {
                const left = 10 + (index * 10);
                const delay = index * 2;
                return `<div class="floating-emoji" style="left: ${left}%; animation-delay: ${delay}s;">${emoji}</div>`;
            }).join('');
        }

        function renderMarquee() {
            const marquee = document.getElementById('marqueeContent');
            // Duplicate items for seamless loop
            const items = [...CONFIG.marqueeItems, ...CONFIG.marqueeItems, ...CONFIG.marqueeItems, ...CONFIG.marqueeItems];
            marquee.innerHTML = items.map(item => `<span class="marquee-item">${item}</span>`).join('');
        }

        function renderProfile() {
            document.getElementById('avatarContent').innerHTML = CONFIG.avatar.startsWith('http') 
                ? `<img src="${CONFIG.avatar}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
                : CONFIG.avatar;
            document.getElementById('statusBadge').textContent = CONFIG.statusBadge;
            document.getElementById('storyTitle').innerHTML = CONFIG.storyTitle;
            document.getElementById('storyContent').innerHTML = CONFIG.storyContent;
        }

        function renderDonationOptions() {
            const grid = document.getElementById('donationGrid');
            grid.innerHTML = CONFIG.donationOptions.map(option => `
                <div class="donation-card ${option.isDefault ? 'selected' : ''}" data-amount="${option.amount}">
                    <div class="donation-emoji">${option.emoji}</div>
                    <div class="donation-amount">${formatCurrency(option.amount)}</div>
                    <div class="donation-desc">${option.description}</div>
                </div>
            `).join('');
            
            // Re-attach event listeners
            document.querySelectorAll('.donation-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.donation-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedAmount = parseInt(card.dataset.amount);
                    updateButtonText();
                });
            });
        }

        function renderFooter() {
            const authorLink = CONFIG.authorLink 
                ? `<a href="${CONFIG.authorLink}" target="_blank">${CONFIG.authorName}</a>`
                : `<a>${CONFIG.authorName}</a>`;
            document.getElementById('footerAuthor').innerHTML = `Made with 💔 by ${authorLink}`;
            document.getElementById('footerText').textContent = CONFIG.footerText;
            document.getElementById('disclaimer').innerHTML = CONFIG.disclaimer;
        }

        // Render section titles
        function renderSectionTitles() {
            document.getElementById('donateSectionTitle').innerHTML = CONFIG.sectionTitleDonate;
            document.getElementById('donorsSectionTitle').innerHTML = CONFIG.sectionTitleDonors;
        }

        // DOM Elements
        const donateBtn = document.getElementById('donateBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const donationList = document.getElementById('donationList');

        // Convert timestamp to relative time
        function timeAgo(dateTimeString) {
            const now = new Date();
            const past = new Date(dateTimeString);
            const diffMs = now - past;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            const diffWeek = Math.floor(diffDay / 7);
            const diffMonth = Math.floor(diffDay / 30);
            const diffYear = Math.floor(diffDay / 365);

            if (diffYear > 0) return `${diffYear} năm trước`;
            if (diffMonth > 0) return `${diffMonth} tháng trước`;
            if (diffWeek > 0) return `${diffWeek} tuần trước`;
            if (diffDay > 0) return `${diffDay} ngày trước`;
            if (diffHour > 0) return `${diffHour} giờ trước`;
            if (diffMin > 0) return `${diffMin} phút trước`;
            if (diffSec > 0) return `${diffSec} giây trước`;
            return 'Vừa xong';
        }

        // Render donation list
        function renderDonationList() {
            // Nếu danh sách rỗng, hiển thị nội dung hook donate
            if (CONFIG.recentDonations.length === 0) {
                donationList.innerHTML = `
                    <div class="empty-donation-state" style="text-align: center; padding: 20px;">
                        <div style="font-size: 4rem; margin-bottom: 20px; animation: bounce 2s infinite;">😢</div>
                        <h3 style="font-size: 1.5rem; color: var(--dark); margin-bottom: 15px;">${CONFIG.emptyDonationTitle}</h3>
                        <p style="font-style: italic; color: #b2bec3; font-size: 0.9rem;">
                            ${CONFIG.emptyDonationQuote}
                        </p>
                    </div>
                `;
                return;
            }

            donationList.innerHTML = CONFIG.recentDonations.map(donation => `
                <div class="donation-item">
                    <div class="donor-avatar">${donation.avatar}</div>
                    <div class="donor-info">
                        <div class="donor-name">${donation.name}</div>
                        <div class="donor-message">"${donation.message}"</div>
                    </div>
                    <div>
                        <div class="donor-amount">${formatCurrency(donation.amount)}</div>
                        <div class="donor-time">${timeAgo(donation.time)}</div>
                    </div>
                </div>
            `).join('');
        }

        // Update button text
        function updateButtonText() {
            donateBtn.innerHTML = `${CONFIG.donateButtonText} ${formatCurrency(selectedAmount)}!`;
        }

        // Format currency
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + ' VNĐ';
        }

        // Show toast
        function showToast(message, emoji = '🎉') {
            toastMessage.textContent = message;
            document.querySelector('.toast-icon').textContent = emoji;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize all dynamic content
        function init() {
            renderFloatingEmojis();
            renderMarquee();
            renderProfile();
            renderDonationOptions();
            renderDonationList();
            renderSectionTitles();
            updateButtonText();
        }

        init();

        donateBtn.addEventListener('click', () => {
            const momoLink = getMoMoLink(selectedAmount);
            showToast('Đang mở MoMo... 💜', '📱');
            window.open(momoLink, '_blank');
        });

        let konamiCode = [];
        const konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        
        document.addEventListener('keydown', (e) => {
            konamiCode.push(e.key);
            konamiCode = konamiCode.slice(-10);
            
            if (konamiCode.join(',') === konamiSequence.join(',')) {
                document.body.style.animation = 'rainbow 1s infinite';
                showToast('🌈 RAINBOW MODE ACTIVATED! 🌈', '🎮');
                
                // Add rainbow animation
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes rainbow {
                        0% { filter: hue-rotate(0deg); }
                        100% { filter: hue-rotate(360deg); }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
